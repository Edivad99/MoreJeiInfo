plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
}

println("Project Version: $mod_version")
println("Java: ${System.getProperty('java.version')}")
println("JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')})")
println("Arch: ${System.getProperty('os.arch')}")

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
            vendor = JvmVendorSpec.JETBRAINS
        }
        withSourcesJar()
        withJavadocJar()
    }
    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : 'Edivad99',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : 'Edivad99',
                'Implementation-Commit'   : 'git rev-parse HEAD'.execute().text.trim(),
            ])
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'JEI'
            url = 'https://maven.blamejared.com'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.getRelease().set(17)
    }

    processResources {
        def expandProps = [
            "version": version,
            "group": project.group, //Else we target the task's group.
            "minecraft_version": minecraft_version,
            "minecraft_version_range": minecraft_version_range,
            "fabricApiVersion": fabricApiVersion,
            "fabricLoaderVersion": fabricLoaderVersion,
            "mod_name": mod_name,
            "mod_id": mod_id,
            "mod_version": mod_version,
            "description": project.description,
            "neo_version": neo_version,
            "neo_loader_version_range": neo_loader_version_range,
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'mods.toml']) {
            expand expandProps
        }
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
}
